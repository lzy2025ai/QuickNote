name: Build macOS app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build .app
        run: |
          set -o pipefail
          ./build.sh 2>&1 | tee build.log

      - name: Verify universal binary
        run: |
          lipo -info build/QuickNote.app/Contents/MacOS/QuickNote
          lipo build/QuickNote.app/Contents/MacOS/QuickNote -verify_arch arm64 x86_64

      - name: Package
        run: |
          cd build
          ditto -c -k --keepParent QuickNote.app QuickNote.zip

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: QuickNote-app
          path: build/QuickNote.zip

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
